name: Update profile art
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: update-profile-art
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/fetch_contributions.py --user anitikrish-ai
      - run: python scripts/render_heatmap_svg.py
      - name: Commit changes
        run: |
          FILES="data/contributions.json contrib-heatmap.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "chore: refresh contribution heatmap [skip ci]"
          git push
