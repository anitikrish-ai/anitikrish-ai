name: Update profile art

# Refreshes ONLY data/contributions.json and contrib-heatmap.svg.
# No push/pull_request triggers, so the commit this workflow makes cannot
# retrigger it (and commits pushed with GITHUB_TOKEN never start new runs).
on:
  schedule:
    - cron: "17 3 * * *" # daily, off the top of the hour
  workflow_dispatch:

# Deny everything by default; the single job below opts in to what it needs.
permissions: {}

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed only to push the regenerated files
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Both scripts use the standard library only, so no pip install step.
      # If fetching fails, the script exits non-zero: the job stops here and
      # nothing is overwritten or committed.
      - name: Fetch contribution calendar
        run: python scripts/fetch_contributions.py --user anitikrish-ai

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit changes (only if generated files changed)
        run: |
          FILES="data/contributions.json contrib-heatmap.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "chore: refresh contribution heatmap [skip ci]"
          git push
